<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Login</title>
</head>
<body>
        <div class="overlay">

    <div class="card">

        <h1>⚽ World Cup Bet</h1>
        <p class="subtitle">Faça suas apostas para a Copa do Mundo</p>

        <form>

            <div class="form-group">
                <label>Email</label>
                <input type="email" placeholder="Digite seu email">
            </div>

            <div class="form-group">
                <label>Senha</label>
                <input type="password" placeholder="Digite sua senha">
            </div>

            <button type="submit">
                Entrar
            </button>
            

            <button type="submit">
                Cadastrar
            </button>

            <a href="#" class="forgot">
                Esqueceu sua senha?
            </a>

        </form>

    </div>

</div>
</body>
</html>
